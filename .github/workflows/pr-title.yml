name: PR title

# PRs are squash-merged, so the PR title becomes the commit on canary and
# must follow Conventional Commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the PR title
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
